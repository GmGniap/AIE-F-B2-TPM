name: Sync Fork with Upstream Classroom Repo

on:
  schedule:
    # Runs at 00:00 UTC every Saturday
    - cron: '0 0 * * 6'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  sync-latest-from-upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
      # Step 1: Checkout fork's main branch
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      # Step 2: Configure Git identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Add Upstream and Sync
      - name: Fetch and Merge Upstream
        run: |
          # Replace with the upstream repo URL
          git remote add upstream https://github.com/ye-kyaw-thu/AIE-F-B2.git
          git fetch upstream main
          
          # Checkout main and merge without creating extra merge commit if fast-forwardable
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
          
          # Push to your fork's main branch
          git push origin main